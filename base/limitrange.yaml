apiVersion: v1
kind: LimitRange
metadata:
  name: audita
  namespace: audita
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 1536Mi
      min:
        cpu: 10m
        memory: 32Mi
