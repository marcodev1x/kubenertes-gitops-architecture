name: web-app

on:
  workflow_call:
    inputs:
      image:
        description: Image name, without the tag.
        required: true
        type: string
      chart:
        description: Chart directory under apps/ in the infra repo.
        required: true
        type: string
      build-args:
        description: NEXT_PUBLIC_* values baked into the bundle, one per line.
        required: false
        type: string
        default: ""
      staging-build-args:
        description: |
          The same, for the `staging` branch. NEXT_PUBLIC_* is baked into the
          bundle at build time, not read at runtime, so without its own set the
          test image ships pointing at the PRODUCTION API. Empty falls back to
          build-args.
        required: false
        type: string
        default: ""
      bun-version:
        description: Bun toolchain for install, lint and typecheck.
        required: false
        type: string
        default: latest
      dockerfile:
        description: Dockerfile path in the calling repository.
        required: false
        type: string
        default: Dockerfile
    secrets:
      INFRA_TOKEN:
        description: Write access to the infrastructure repository.
        required: true

env:
  INFRA_REPO: ****/infrastructure
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ (github.ref == 'refs/heads/staging' && inputs.staging-build-args) || inputs.build-args }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-${{ inputs.chart }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          ref: main
          token: ${{ secrets.INFRA_TOKEN }}

      - name: Resolve environment
        id: env
        run: |
          if [ "$GITHUB_REF" = "refs/heads/staging" ]; then
            echo "values=apps/${{ inputs.chart }}/values-staging.yaml" >> "$GITHUB_OUTPUT"
            echo "name=staging" >> "$GITHUB_OUTPUT"
          else
            echo "values=apps/${{ inputs.chart }}/values-production.yaml" >> "$GITHUB_OUTPUT"
            echo "name=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        env:
          SHA: ${{ github.sha }}
          VALUES: ${{ steps.env.outputs.values }}
        run: |
          awk -v sha="$SHA" '
            /^image:/        { inimg = 1; print; next }
            /^[^[:space:]#]/ { inimg = 0 }
            inimg && !done && /^[[:space:]]+tag:[[:space:]]/ {
              sub(/tag:.*/, "tag: " sha); done = 1
            }
                             { print }
            END { if (!done) { print "image.tag não encontrado em " FILENAME > "/dev/stderr"; exit 1 } }
          ' "$VALUES" > "$VALUES.new"
          mv "$VALUES.new" "$VALUES"

      - name: Commit to infra repo
        env:
          SHA: ${{ github.sha }}
          CHART: ${{ inputs.chart }}
          ENVNAME: ${{ steps.env.outputs.name }}
          VALUES: ${{ steps.env.outputs.values }}
        run: |
          git config user.name "****-ci[bot]"
          git config user.email "****-ci[bot]@users.noreply.github.com"
          git add "$VALUES"
          if git diff --cached --quiet; then
            echo "\`$CHART\` already at \`$SHA\` in $ENVNAME." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ci(${CHART}): deploy ${ENVNAME} ${SHA}"
          for _ in 1 2 3 4 5; do
            if git push origin main; then
              echo "\`$CHART\` pinned to \`$SHA\` in $ENVNAME." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
