image:
  name: ghcr.io/****/audita-api-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 307MiB

env:
  BIDS_HOST: "bids:9090"
  CLIENT_HOST: "client:9090"
  PNCP_HOST: "pncp:9090"
  AGENTS_HOST: "agents:9090"
  BILLINGS_HOST: "billings:9090"
  WHITELABEL_HOST: "whitelabel:9090"
  AUTOMATIONS_HOST: "automations:9090"
  COUPONS_HOST: "coupons:9090"
  LIMITS_HOST: "limits:9090"
  CERTIFICATES_HOST: "certificates:9090"
  CDN_HOST: "http://cdn:8080"

secretEnv: {}

metricsPort: 19090
