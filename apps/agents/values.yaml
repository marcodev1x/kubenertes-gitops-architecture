image:
  name: ghcr.io/****/agents
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 60

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 819MiB

env:
  DB_NAME: "bids"
  CLIENT_HOST: "client:9090"
  LIMITS_HOST: "limits:9090"

secretEnv:
  REDIS_PASSWORD: redis-password
  MONGODB_URL: mongodb-url
  OPENAI_API_KEY: openai-api-key

metricsPort: 19090
