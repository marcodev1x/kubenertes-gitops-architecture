apiVersion: v1
kind: Service
metadata:
  name: audita-web
  labels:
    app: audita-web
spec:
  selector:
    app: audita-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      appProtocol: http
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: audita-web-destination
  labels:
    app: audita-web
spec:
  host: audita-web
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 64
        connectTimeout: 3s
      http:
        http2MaxRequests: 256
        maxRequestsPerConnection: 0
        maxRetries: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: audita-web-route
  labels:
    app: audita-web
spec:
  hosts:
    - {{ .Values.ingress.host }}
  gateways:
    - audita-gateway
  http:
    - match:
        - uri:
            prefix: {{ .Values.ingress.prefix }}
      timeout: {{ .Values.ingress.timeout }}
      retries:
        attempts: 2
        perTryTimeout: 10s
        retryOn: connect-failure,refused-stream,unavailable
      route:
        - destination:
            host: audita-web
            subset: v1
            port:
              number: 3000
{{- end }}
