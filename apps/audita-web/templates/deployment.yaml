apiVersion: apps/v1
kind: Deployment
metadata:
  name: audita-web
  labels:
    app: audita-web
    version: v1
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: audita-web
      version: v1
  template:
    metadata:
      labels:
        app: audita-web
        version: v1
      annotations:
        sidecar.istio.io/proxyCPU: "{{ .Values.istio.proxy.cpu }}"
        sidecar.istio.io/proxyMemory: "{{ .Values.istio.proxy.memory }}"
        sidecar.istio.io/proxyCPULimit: "{{ .Values.istio.proxy.cpuLimit }}"
        sidecar.istio.io/proxyMemoryLimit: "{{ .Values.istio.proxy.memoryLimit }}"
    spec:
      serviceAccountName: audita-web
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: audita-web
      containers:
        - name: audita-web
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 18
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: audita
                  key: {{ $v }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: audita-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 128Mi
