image:
  name: ghcr.io/****/bids
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 614MiB

env:
  DB_NAME: "bids"
  PNCP_HOST: "pncp:9090"
  AGENTS_HOST: "agents:9090"
  CLIENT_HOST: "client:9090"
  MAILER_HOST: "mailer:9090"
  AUTOMATIONS_HOST: "automations:9090"

secretEnv:
  REDIS_PASSWORD: redis-password
  MONGODB_URL: mongodb-url

metricsPort: 19090

cronjobs:
  - name: collect-bids
    command: collect-bids
    schedule: "0 7,14,20 * * *"
    deadline: 3600
    goMemLimit: "819MiB"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  - name: send-recommendations
    command: send-recommendations
    schedule: "0 8,15,21 * * *"
    deadline: 2700
    goMemLimit: "614MiB"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1500m"
        memory: 768Mi
