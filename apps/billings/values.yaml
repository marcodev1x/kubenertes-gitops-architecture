image:
  name: ghcr.io/****/billings
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 307MiB

env:
  DB_NAME: "billings"
  CLIENT_HOST: "client:9090"
  COUPONS_HOST: "coupons:9090"
  AUDITA_PAYMENT_PROVIDER: "MP"

secretEnv:
  REDIS_PASSWORD: redis-password
  MONGODB_URL: mongodb-url
  MP_ACCESS_TOKEN: mp-access-token

metricsPort: 19090
