---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: audita
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: audita
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: audita
data:
  vector.yaml: |
    sources:
      k8s:
        type: kubernetes_logs
    sinks:
      vlogs:
        type: elasticsearch
        inputs: [k8s]
        endpoints:
          - http://victorialogs:9428/insert/elasticsearch/
        mode: bulk
        api_version: v8
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: audita
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.44.0-debian
          args: [--config, /etc/vector/vector.yaml]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
