---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: audita
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-sd
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics-sd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-sd
subjects:
  - kind: ServiceAccount
    name: victoriametrics
    namespace: audita
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape
  namespace: audita
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        env: prod
    scrape_configs:
      - job_name: audita-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [audita]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: audita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: victoriametrics
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.115.0
          args:
            - -promscrape.config=/etc/vm/scrape.yml
            - -retentionPeriod=3
            - -storageDataPath=/vmdata
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: scrape
              mountPath: /etc/vm
            - name: data
              mountPath: /vmdata
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: scrape
          configMap:
            name: victoriametrics-scrape
        - name: data
          persistentVolumeClaim:
            claimName: victoriametrics-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-data
  namespace: audita
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: audita
spec:
  selector:
    app: victoriametrics
  ports:
    - name: http
      port: 8428
      targetPort: 8428
