image:
  name: ghcr.io/****/audita-api-auth-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 204MiB

env:
  CLIENT_HOST: "client:9090"

secretEnv: {}

metricsPort: 19090
