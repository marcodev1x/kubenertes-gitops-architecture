apiVersion: v1
kind: Service
metadata:
  name: api-auth-gateway
  labels:
    app: api-auth-gateway
spec:
  selector:
    app: api-auth-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http
    - name: http-metrics
      port: 19090
      targetPort: 19090
      appProtocol: http
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-auth-gateway-destination
  labels:
    app: api-auth-gateway
spec:
  host: api-auth-gateway
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 64
        connectTimeout: 3s
      http:
        http2MaxRequests: 256
        maxRequestsPerConnection: 0
        maxRetries: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
