image:
  name: ghcr.io/****/webhooks
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 75

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 204MiB

env:

secretEnv:
  REDIS_PASSWORD: redis-password
  MP_SIGNATURE: mp-signature
  MP_ACCESS_TOKEN: mp-access-token

metricsPort: 19090
