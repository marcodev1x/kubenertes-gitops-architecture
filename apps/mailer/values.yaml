image:
  name: ghcr.io/****/mailer
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 192Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 70

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 153MiB

env:
  CLIENT_HOST: "client:9090"
  EMAIL_HOST: "****"
  EMAIL_PORT: "465"
  EMAIL_USERNAME: "nao-responda@****"

secretEnv:
  EMAIL_PASSWORD: email-password
  META_ACCESS_TOKEN: meta-access-token
  META_PHONE_NUMBER_ID: meta-phone-number-id

metricsPort: 19090
