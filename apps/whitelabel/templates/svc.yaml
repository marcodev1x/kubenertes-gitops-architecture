apiVersion: v1
kind: Service
metadata:
  name: whitelabel
  labels:
    app: whitelabel
spec:
  selector:
    app: whitelabel
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      appProtocol: grpc
    - name: http-metrics
      port: 19090
      targetPort: 19090
      appProtocol: http
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: whitelabel-destination
  labels:
    app: whitelabel
spec:
  host: whitelabel
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 64
        connectTimeout: 3s
      http:
        http2MaxRequests: 256
        maxRequestsPerConnection: 0
        maxRetries: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
