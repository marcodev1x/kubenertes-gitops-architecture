apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  labels:
    app: mesh
spec:
  mtls:
    mode: {{ .Values.mtls.mode }}

---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  labels:
    app: mesh
spec:
  egress:
    - hosts:
        - "./*"
        - "istio-system/*"
  outboundTrafficPolicy:
    mode: ALLOW_ANY
