image:
  name: ghcr.io/****/coupons
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 192Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPU: 75

istio:
  proxy:
    cpu: 25m
    memory: 48Mi
    cpuLimit: 200m
    memoryLimit: 192Mi

goMemLimit: 153MiB

env:
  DB_NAME: "coupons"

secretEnv:
  REDIS_PASSWORD: redis-password
  MONGODB_URL: mongodb-url

metricsPort: 19090
