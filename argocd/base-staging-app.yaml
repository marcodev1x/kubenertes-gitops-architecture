apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: audita
  source:
    repoURL: https://github.com/****/infrastructure.git
    targetRevision: main
    path: base-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: audita-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
